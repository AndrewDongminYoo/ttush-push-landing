allowBuilds:
  sharp: true
  unrs-resolver: true

# Security overrides for versions next pins below the patched releases:
# postcss GHSA (sourceMappingURL file disclosure, <=8.5.17) and
# sharp/libvips CVEs (<0.35.0). Drop when next's own ranges catch up.
overrides:
  postcss: ">=8.5.22"
  sharp: ">=0.35.0"
# brace-expansion needs no override: its fixes sit inside the ranges minimatch
# asks for, so an in-range update (`pnpm update brace-expansion --depth 99`)
# reaches them. GHSA-rgw5-rvv9-x895 took the 5.x copy under minimatch@10 to
# 5.0.9, and GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7 and GHSA-q2hr-2g5m-vwhr
# took it to 5.0.12 and the 1.x copy under eslint's minimatch@3 to 1.1.21.
